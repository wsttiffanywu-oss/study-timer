<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Timer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="modal-overlay" id="modalOverlay" style="display:none;">
  <div class="modal-card" id="modalCard"></div>
</div>
<div class="app">
  <h1 data-i18n="app.h1"></h1>
  <div class="db-status" id="dbStatus" data-i18n="db.init"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="timerTab" data-i18n="tab.timer"></button>
    <button class="tab-btn" data-tab="calTab" data-i18n="tab.cal"></button>
    <select id="langSelect" class="lang-select" aria-label="Language" style="margin-left:auto;"></select>
    <button class="btn-outline small" id="settingsBtn" style="align-self:center;" data-i18n="settings.btn"></button>
  </div>

  <!-- ============ TIMER TAB ============ -->
  <div class="tab-panel active" id="timerTab">
    <div class="card">
      <div class="row">
        <select id="courseSelect"></select>
        <input type="text" id="newCourseInput" data-i18n-ph="course.newPh">
        <button class="btn-outline small" id="addCourseBtn" data-i18n="course.add"></button>
        <button class="btn-outline small" id="manageCourseBtn" data-i18n="course.manage"></button>
      </div>

      <div class="timer-display" id="timerDisplay">00:00:00</div>
      <div class="status" id="statusText" data-i18n="timer.pickHint"></div>

      <div class="row actions">
        <button class="btn-primary" id="startBtn" data-i18n="timer.start"></button>
        <button class="btn-outline" id="pauseBtn" disabled data-i18n="timer.pause"></button>
        <button class="btn-danger" id="stopBtn" disabled data-i18n="timer.stop"></button>
      </div>

      <div class="note-label" data-i18n="timer.noteLabel"></div>
      <textarea id="noteInput" data-i18n-ph="timer.notePh"></textarea>
    </div>

    <div class="card">
      <div class="row toolbar">
        <div class="summary-title" data-i18n="rec.title"></div>
        <div class="row">
          <input type="text" id="filterDate" data-i18n-ph="rec.filterPh" style="min-width:170px;">
          <button class="btn-outline small" id="clearFilterBtn" data-i18n="rec.clearFilter"></button>
          <button class="btn-outline small" id="trashBtn" data-i18n="rec.trash"></button>
          <button class="btn-outline small" id="exportBtn" data-i18n="rec.exportCsv"></button>
        </div>
      </div>
      <div id="recordsContainer"></div>
    </div>
  </div>

  <!-- ============ CALENDAR TAB ============ -->
  <div class="tab-panel" id="calTab">
    <div class="card">
      <div class="row toolbar">
        <div class="summary-title" data-i18n="cal.backupTitle"></div>
        <div class="row">
          <button class="btn-primary small" id="aiImportBtn" data-i18n="cal.aiImport"></button>
          <button class="btn-outline small" id="exportBackupBtn" data-i18n="cal.exportJson"></button>
          <button class="btn-outline small" id="importBackupBtn" data-i18n="cal.importJson"></button>
          <input type="file" id="importBackupInput" accept="application/json" style="display:none;">
        </div>
      </div>
      <div class="empty" style="padding:0;" data-i18n="cal.backupHelp"></div>
    </div>

    <div class="card">
      <div class="row week-nav">
        <button class="btn-outline small" id="prevWeekBtn" data-i18n="cal.prev"></button>
        <div class="week-label" id="weekLabel"></div>
        <button class="btn-outline small" id="nextWeekBtn" data-i18n="cal.next"></button>
      </div>
      <div class="row toggle-row">
        <label><input type="checkbox" id="toggleOH"> <span data-i18n="cal.showOH"></span></label>
        <label><input type="checkbox" id="toggleActivity"> <span data-i18n="cal.showActivity"></span></label>
        <label><input type="checkbox" id="toggleLog"> <span data-i18n="cal.showLog"></span></label>
        <label><input type="checkbox" id="toggleExpand"> <span data-i18n="cal.expand"></span></label>
        <span style="color:var(--muted); font-size:12px;" data-i18n="cal.hint"></span>
      </div>
      <div class="cal-scroll" id="calScrollContainer">
        <div class="cal-header-row" id="calHeaderRow"></div>
        <div class="cal-timegrid">
          <div class="cal-timeaxis" id="calTimeAxis"></div>
          <div class="cal-days" id="calDays"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="summary-title" style="margin-bottom:10px;" data-i18n="form.title"></div>
      <div class="form-grid">
        <div class="full">
          <label class="form-label" data-i18n="form.course"></label>
          <div class="row" style="gap:8px;">
            <select id="evCourseSelect"></select>
            <input type="text" id="evNewCourseInput" data-i18n-ph="form.newCoursePh">
          </div>
        </div>
        <div class="full">
          <label class="form-label" data-i18n="form.type"></label>
          <select id="evKindSelect">
            <option value="class" data-i18n="kind.class"></option>
            <option value="officehour" data-i18n="kind.officehour"></option>
            <option value="activity" data-i18n="kind.activity"></option>
            <option value="exam" data-i18n="kind.exam"></option>
          </select>
        </div>
        <div class="full radio-row">
          <label><input type="radio" name="evType" value="recurring" checked> <span data-i18n="form.recurring"></span></label>
          <label><input type="radio" name="evType" value="oneoff"> <span data-i18n="form.oneoff"></span></label>
        </div>
        <div id="evDayWrap">
          <label class="form-label" data-i18n="form.day"></label>
          <select id="evDaySelect">
            <option value="0" data-i18n-day="0"></option>
            <option value="1" data-i18n-day="1"></option>
            <option value="2" data-i18n-day="2"></option>
            <option value="3" data-i18n-day="3"></option>
            <option value="4" data-i18n-day="4"></option>
            <option value="5" data-i18n-day="5"></option>
            <option value="6" data-i18n-day="6"></option>
          </select>
        </div>
        <div id="evDateWrap" style="display:none;">
          <label class="form-label" data-i18n="form.date"></label>
          <input type="date" id="evDateInput" style="width:100%;">
        </div>
        <div class="full" id="evRangeWrap">
          <label class="form-label" data-i18n="form.range"></label>
          <div class="row" style="gap:8px; flex-wrap:nowrap;">
            <input type="date" id="evStartDateInput" style="flex:1; min-width:0;">
            <span style="color:var(--muted);">~</span>
            <input type="date" id="evEndDateInput" style="flex:1; min-width:0;">
          </div>
        </div>
        <div>
          <label class="form-label" data-i18n="form.start"></label>
          <input type="time" id="evStartInput" style="width:100%;">
        </div>
        <div>
          <label class="form-label" data-i18n="form.end"></label>
          <input type="time" id="evEndInput" style="width:100%;">
        </div>
        <div class="full">
          <label class="form-label" data-i18n="form.loc"></label>
          <input type="text" id="evLocInput" style="width:100%;" data-i18n-ph="form.locPh">
        </div>
      </div>
      <button class="btn-primary" id="addEventBtn" data-i18n="form.add"></button>
    </div>
  </div>
</div>

<!-- sql.js: SQLite compiled to WebAssembly, runs entirely in the browser -->
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.11.0/dist/sql-wasm.js"></script>
<!-- optional, kept out of the repository (see .gitignore): the "原版" wording overlay. The app works without it. -->
<script src="i18n-orig.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="ai-import.js"></script>
</body>
</html>
